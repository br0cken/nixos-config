name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Formatting
        run: nix fmt -- --ci

      - name: Flake check
        run: nix flake check --no-build

      # nix flake check only evaluates nixosConfigurations deeply, so the
      # darwin and standalone home-manager configs are evaluated by hand.
      - name: Evaluate configurations
        run: |
          nix eval --raw .#nixosConfigurations.odin.config.system.build.toplevel.drvPath
          nix eval --raw .#darwinConfigurations.yggdrasil.config.system.build.toplevel.drvPath
          nix eval --raw .#homeConfigurations.wsl.activationPackage.drvPath
